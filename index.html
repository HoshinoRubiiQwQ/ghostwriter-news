const PER_PAGE = 20;
let page = 1, filtered = [...ALL];

function filterArticles() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  filtered = q ? ALL.filter(a => a.t.toLowerCase().includes(q) || a.s.toLowerCase().includes(q)) : [...ALL];
  page = 1; render();
}

function render() {
  const list = document.getElementById('articleList');
  const total = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (page > total) page = total;
  const items = filtered.slice((page - 1) * PER_PAGE, page * PER_PAGE);

  if (!items.length) {
    list.innerHTML = '<div class="empty">没有匹配的项目</div>';
  } else {
    list.innerHTML = items.map(a => {
      const slug = a.t.replace(/[^a-zA-Z0-9_-]/g, '-');
      const detailLink = 'projects/' + slug + '.html';
      return '<div class="project-card" data-href="' + detailLink + '">' +
        '<div class="card-top">' +
          '<a href="' + a.l + '" target="_blank" class="card-name" onclick="event.stopPropagation()">' + a.t + '</a>' +
          '<span class="card-date">' + a.d + ' ' + a.m.slice(0,2) + ':' + a.m.slice(2) + '</span>' +
        '</div>' +
        '<div class="card-summary">' + a.s + '</div>' +
        '<div class="card-footer">' +
          '<span>→ 点击查看详情</span>' +
        '</div>' +
      '</div>';
    }).join('');

    document.querySelectorAll('.project-card[data-href]').forEach(card => {
      card.addEventListener('click', () => { window.location.href = card.dataset.href; });
    });
  }

  document.getElementById('pageInfo').textContent = page + ' / ' + total + ' · 共 ' + filtered.length + ' 个项目';
  document.getElementById('prevBtn').disabled = page <= 1;
  document.getElementById('nextBtn').disabled = page >= total;
}

function changePage(d) { page += d; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
render();
</script>
