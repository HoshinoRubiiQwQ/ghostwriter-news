const PER_PAGE = 15;
let currentPage = 1;
let filtered = [...ALL_ARTICLES];

function filterArticles() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  if (!q) {
    filtered = [...ALL_ARTICLES];
  } else {
    filtered = ALL_ARTICLES.filter(a =>
      a.t.toLowerCase().includes(q) ||
      a.s.toLowerCase().includes(q)
    );
  }
  currentPage = 1;
  render();
}

function render() {
  const list = document.getElementById('articleList');
  const totalPages = Math.max(1, Math.ceil(filtered.length / PER_PAGE));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * PER_PAGE;
  const pageItems = filtered.slice(start, start + PER_PAGE);

  if (pageItems.length === 0) {
    list.innerHTML = '<div class="empty">没有找到匹配的文章</div>';
  } else {
    // Group by date
    const groups = {};
    for (const a of pageItems) {
      const key = a.d + ' ' + a.m.slice(0,2) + ':' + a.m.slice(2);
      if (!groups[key]) groups[key] = [];
      groups[key].push(a);
    }

    let html = '';
    const sortedKeys = Object.keys(groups).sort().reverse();
    for (const dateKey of sortedKeys) {
      html += '<div class="date-group">';
      html += '<div class="date-label">' + dateKey + '</div>';
      for (const a of groups[dateKey]) {
        html += '<div class="article">';
        html += '<div class="article-title"><a href="' + a.l + '" target="_blank" rel="noopener">' + a.t + '</a></div>';
        html += '<div class="article-summary">' + a.s + '</div>';
        html += '</div>';
      }
      html += '</div>';
    }
    list.innerHTML = html;
  }

  // Update pagination
  document.getElementById('pageInfo').textContent = currentPage + ' / ' + totalPages + ' · 共 ' + filtered.length + ' 篇';
  document.getElementById('prevBtn').disabled = currentPage <= 1;
  document.getElementById('nextBtn').disabled = currentPage >= totalPages;
}

function changePage(delta) {
  currentPage += delta;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// Init
render();
</script>
